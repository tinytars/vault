name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  autopilot-guard:
    # The rules are in .github/autopilot.json. Which pull requests it applies to is an input, not a
    # job-level `if:`: a required check that reports SKIPPED blocks the merge forever.
    if: github.event_name == 'pull_request'
    uses: promontory-studio/pedalion/.github/workflows/guard.yml@e4e338d845be827465c177aefed794a2566af1cb
    with:
      base-ref: ${{ github.base_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      authors: plover-autopilot[bot],pedalion[bot],dependabot[bot]
      pr-author: ${{ github.event.pull_request.user.login }}

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Bump patch version
        id: bump
        run: |
          version=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          new_version="$major.$minor.$patch"
          npm version "$new_version" --no-git-tag-version
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes

  notify-failure:
    needs: [test, release]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    uses: promontory-studio/pedalion/.github/workflows/notify-failure.yml@e4e338d845be827465c177aefed794a2566af1cb
    with:
      title: CI failed on main
      context: A push to main did not build, test or release, so the published package no longer matches main.
      assignee: pablo-tech
